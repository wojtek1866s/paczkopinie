name: Security Scan (Secrets + SAST)

on:
  # Wyzwalacz dla push na main, master lub dev
  push:
    branches: [ "main", "master", "dev" ]
  # Wyzwalacz dla pull requestów skierowanych na main, master lub dev
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:
  
jobs:
  # ZADANIE 1: Skanowanie sekretów
  secrets_scan:
    name: 🕵️ Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wymagane, aby Gitleaks mógł sprawdzać historię commitów

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ZADANIE 2: Skanowanie bezpieczeństwa Pythona (SAST + podatności przez pip-audit)
  
  python_security:
    name: Python Security (Bandit + Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Dostosuj wersję do projektu

      - name: Install Security Tools
        run: pip install bandit pip-audit

      # Krok SAST - statyczna analiza kodu
      - name: Code Scan (Bandit)
        # -r: rekurencyjny, -ll: poziom raportowania Średni/Wysoki
        run: bandit -r . -ll

      # Krok SCA - analiza podatności bibliotek
      - name: Dependency Scan (pip-audit)
        # Sprawdza, czy plik istnieje, aby uniknąć błędu jeśli brakuje
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            echo "⚠️ requirements.txt not found - skipping dependency scan."
          fi
